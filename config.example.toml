# Configuration for the discord-anti-scam-bot bot.
# The bot token does NOT go here: put it in the .env file (DISCORD_TOKEN=...).
#
# Copy this file to config.toml and edit it — config.toml is gitignored so your
# server-specific IDs (log channel, mod roles) never end up committed.

[bot]
# Prefix for moderation commands (!scam add, !scam list, !scam remove)
prefix = "!scam"
# Channel where the bot posts evidence for every detection (image, matched reference, score, action taken).
# Set to 0 to disable logging.
log_channel_id = 0
# Roles allowed to manage reference images (!scam add / remove).
# Leave empty = only members with the "Manage Messages" permission can use them.
mod_role_ids = []

[moderation]
# Action applied when a sent image matches a known scam reference:
#   "log_only"       -> only logs, no automatic sanction
#   "delete_only"     -> deletes the message, no sanction on the account
#   "delete_timeout"   -> deletes the message + times out the account (recommended)
#   "delete_kick"      -> deletes the message + kicks the member
#   "delete_ban"       -> deletes the message + bans the member
action = "delete_timeout"
# Timeout duration in minutes (used if action = "delete_timeout"). Discord max = 40320 (28 days).
timeout_minutes = 1440

# Roles exempt from any detection (e.g. "Staff", "Bot" role)
exempt_role_ids = []
# Channels exempt from detection (e.g. a test/archive channel where scam samples are shared on purpose)
exempt_channel_ids = []

[detection]
# Folder containing reference images (screenshots of known compromised accounts).
reference_dir = "reference"
# Max Hamming distance (16x16 perceptual hash = 256 bits) below which a sent image is
# considered a match against a reference.
# Lower = stricter match (fewer false positives, but may miss slightly cropped/recompressed
# scams). ~15-20 is a good starting point.
match_threshold = 18

# Flood detection: the same account posting the same image across several different
# channels in a short time is a strong sign of a compromised account (cross-channel
# auto-post), even if the image doesn't match any known reference yet.
[flood]
enabled = true
# Minimum number of distinct channels hit by the same image to trigger the alert.
min_channels = 3
# Time window in seconds over which the user's activity is tracked.
window_seconds = 60
# Max Hamming distance to consider two images "the same" in this context.
same_image_threshold = 6
